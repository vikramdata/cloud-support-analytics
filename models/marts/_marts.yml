version: 2

models:
  - name: fct_cases
    description: One row per support case with SLA, duration and CSAT measures. Main table for slicing in Looker Studio.
    columns:
      - name: case_id
        data_tests: [unique, not_null]
      - name: agent_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agents')
                field: agent_id
      - name: support_tier
        data_tests: [not_null]
      - name: first_response_target_minutes
        description: First-response target for this case's support tier and priority.
        data_tests: [not_null]
      - name: first_response_minutes
        description: Minutes from case creation to the first agent response.
      - name: met_first_response_sla
        description: True when the first response came within the target. Null if no response yet.
      - name: resolution_hours
        description: Hours from creation to resolution. Null for open cases and cases with an invalid resolved_at.
      - name: csat_score
        description: Latest valid CSAT score (1-5) for the case. Null if no valid survey.
      - name: is_satisfied
        description: True when csat_score is 4 or 5.

  - name: mart_kpi_daily
    description: Single source of truth for daily support KPIs. See METRICS.md for definitions.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: open_backlog_end_of_day
        description: Cases created but not yet resolved at the end of the day.
      - name: first_response_sla_rate
        description: first_responses_within_sla / first_responses_measured.
      - name: csat_satisfaction_rate
        description: csat_satisfied_responses / csat_responses (share of 4-5 scores).
      - name: escalation_rate
        description: cases_escalated / cases_created.

  - name: dq_checks
    description: Data quality scorecard, one row per check.
    columns:
      - name: check_name
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_agents
    columns:
      - name: agent_id
        data_tests: [unique, not_null]

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
